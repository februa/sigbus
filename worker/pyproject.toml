[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigbus-worker"
version = "0.1.0"
description = "Transport-independent execution of periodic and event-driven modules"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
